[project]
name = "nexproto"
version = "0.1.0"
description = "Gemeinsame Formate für NexBoard, Hub und Bot"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexproto"]
