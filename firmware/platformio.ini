; DeckBar-Firmware für Waveshare ESP32-S3-Touch-LCD-3.49 V2
;
; Waveshare verlangt Arduino-ESP32 >= 3.3.0 und LVGL 9.3.0. Die offizielle PlatformIO-
; Plattform liefert nur Arduino 2.x, daher pioarduino (Community-Plattform, Arduino 3.3.12).
; Board-Einstellungen wie in "Tools Configuration.png" des V2-Repos:
;   16 MB Flash QIO 80 MHz, OPI-PSRAM, USB-CDC on Boot, Partition 3 MB App / 9.9 MB FATFS.

[env:deckbar]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/../shared-ui
    -O2

lib_deps =
    lvgl/lvgl@9.3.0
    links2004/WebSockets@2.6.1
    symlink://../shared-ui
