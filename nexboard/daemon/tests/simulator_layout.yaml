# Referenzbilder des Simulators: je Seite ein Bild (test_simulator.py). Jeder Kacheltyp in den
# Größen und Zuständen, die ui.c unterschiedlich zeichnet.
pages:
  - id: buttons
    items:
      - {id: b1, label: Standard, icon: youtube}
      - {id: b2, label: Akzent, icon: headphones, style: accent}
      - {id: b3, label: Gefahr, icon: power, style: danger}
      - {id: b4, label: Erfolg, icon: check, style: success}
      - {id: b5, label: Warnung, icon: alert, style: warning}
      - {id: b6, label: Weiter, icon: chevron-right, nav: buttons}
      - {id: b7, label: Ein sehr langer Name, icon: monitor, w: 2}
      - {id: b8, icon: cog}
      - {id: b9, label: Groß, icon: gamepad-variant, w: 2}

  - id: toggles
    items:
      - {id: t1, type: toggle, label: Mikro, icon: microphone, icon_on: microphone-off, bind: mic_muted,
         style: danger}
      - {id: t2, type: toggle, label: Aus, icon: lightbulb, bind: licht_aus, style: success}
      - {id: t3, type: toggle, label: Wiedergabe, icon: play, icon_on: pause, bind: playing, style: accent, w: 2}

  - id: sliders
    items:
      - {id: s1, type: slider, label: Lautstärke, icon: volume-high, icon_on: volume-off, bind: out_volume,
         mute_bind: out_muted, w: 2}
      - {id: s2, type: slider, label: Mikro, icon: microphone, icon_on: microphone-off, bind: mic_volume,
         mute_bind: mic_muted, w: 2}
      - {id: s3, type: slider, label: Hell, icon: brightness-6, bind: hell, min: 10, max: 50, w: 2, h: 2}

  - id: media
    items:
      - {id: m1, type: media, w: 3, h: 2}
      - {id: m2, type: media, w: 3}

  - id: dps
    cols: 6
    rows: 3
    items:
      - {id: d1, type: dps, w: 4, h: 3, players: 8}
      - {id: d2, type: dps, w: 2, h: 2, players: 3, extra: dmg}
      - {id: d3, type: dps, w: 2, players: 1, extra: none}

  - id: claude
    items:
      - {id: c1, type: claude, w: 3, h: 2}
      - {id: c2, type: claude, w: 2}
