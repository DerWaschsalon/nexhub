<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>NexBoard Overlay</title>
<link rel="stylesheet" href="effects.css">
<link rel="stylesheet" href="overlay.css">
<script src="qrc:///qtwebchannel/qwebchannel.js" onerror="this.remove()"></script>
</head>
<body>
<div id="guides" aria-hidden="true"><div class="gv"></div><div class="gh"></div></div>

<div id="toolbar" role="toolbar" aria-label="Overlay bearbeiten">
  <div class="tb-title"><span class="dot"></span>Overlay bearbeiten</div>
  <span class="tb-hint">Ziehen = verschieben · Mausrad = Größe · Shift = frei · Esc = fertig</span>
  <label class="tb-select" title="Profil = welche Widgets sichtbar sind (Tastenkürzel: deckbar-overlay --profile NAME)">Profil
    <select id="profile"></select>
  </label>
  <div class="tb-group" id="toggles"></div>
  <button id="reset" type="button">Positionen zurücksetzen</button>
  <button id="done" type="button" class="primary">Fertig</button>
</div>

<button id="edit-button" type="button" title="Overlay bearbeiten (Widgets verschieben und an-/ausschalten)" aria-label="Overlay bearbeiten">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm17.7-10.2a1 1 0 0 0 0-1.42l-2.33-2.33a1 1 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
</button>

<div id="offline" hidden>NexBoard-Daemon nicht erreichbar – verbinde neu …</div>

<!-- Die Widgets hängt stage.js ein: eines je Anmeldung der eingeschalteten Module (widgets/<id>.js) -->
<main id="stage"></main>

<script type="module" src="main.js"></script>
</body>
</html>
