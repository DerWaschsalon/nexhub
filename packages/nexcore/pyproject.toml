[project]
name = "nexcore"
version = "0.1.0"
description = "Kern für NexBoard, Hub und Bot: Module, Ereignisse, Einstellungen, Hilfsdienste"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexcore"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
strict = true
packages = ["nexcore"]
