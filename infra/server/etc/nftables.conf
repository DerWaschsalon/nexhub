#!/usr/sbin/nft -f
# Firewall waschsalon, verwaltet in infra/server/etc/nftables.conf (DerWaschsalon/nexhub).
# Eigene Tabelle statt "flush ruleset": Docker legt eigene Tabellen an, die beim Neuladen
# erhalten bleiben müssen. Der Anbieter filtert zusätzlich vor dem Server (nur 22 offen).
#
# Hinweis Docker: veröffentlichte Container-Ports laufen über forward/DNAT und an dieser
# input-Kette vorbei. Ports deshalb nur auf 127.0.0.1 veröffentlichen oder über den Reverse-Proxy.

table inet waschsalon
delete table inet waschsalon

table inet waschsalon {
	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept

		tcp dport 22 accept comment "SSH"
	}
}
