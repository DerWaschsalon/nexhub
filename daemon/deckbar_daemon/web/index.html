<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>DeckBar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235AC8FA'/%3E%3Cstop offset='1' stop-color='%238F7CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='9' width='28' height='14' rx='5' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/deck.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="sidebar glass" aria-label="Navigation">
    <a class="brand" href="#/" style="text-decoration:none;color:inherit">
      <span class="logo ic" id="logo" aria-hidden="true"></span>
      <span><b id="brand-name">DeckBar</b><small>Steuerzentrale</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="conn" id="conn"><span class="dot"></span><span class="t">Verbinde …</span></div>
      <button type="button" class="btn ghost icon sm" id="theme-btn" title="Hell/Dunkel" aria-label="Hell/Dunkel umschalten"></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar glass">
      <button type="button" class="btn ghost icon menu-btn" id="menu-btn" aria-label="Menü"></button>
      <div class="crumbs"><small id="crumb"></small><h1 id="title">DeckBar</h1></div>
      <div class="spacer"></div>
      <div id="tabs"></div>
      <div class="save-state" id="save-state" aria-live="polite"></div>
    </header>
    <div class="banners" id="banners"></div>
    <div id="view"></div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog id="icon-dialog">
  <form method="dialog" class="dlg">
    <div class="row">
      <input id="icon-search" placeholder="Icon suchen …" autocomplete="off">
      <button value="none" type="submit" class="btn ghost">Kein Icon</button>
      <button value="cancel" type="submit" class="btn ghost">Abbrechen</button>
    </div>
    <div class="icon-grid" id="icon-grid"></div>
  </form>
</dialog>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
