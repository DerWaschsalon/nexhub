[project]
name = "deckbar-daemon"
version = "0.1.0"
description = "PC-Daemon für die DeckBar-Touchleiste"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "pillow>=11",
    "pydantic>=2.9",
    "pyserial>=3.5",
    "pyyaml>=6",
    "zeroconf>=0.136",
]

[project.scripts]
deckbar-daemon = "deckbar_daemon.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deckbar_daemon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
