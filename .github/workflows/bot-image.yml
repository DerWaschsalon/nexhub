name: Bot-Image

on:
  push:
    branches: [main]
    paths: ["bot/**", "proto/**", ".github/workflows/bot-image.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: bot
          # Gemeinsame Formate aus dem Monorepo als Paket (bot/Dockerfile: COPY --from=proto)
          build-contexts: proto=proto
          push: true
          tags: |
            ghcr.io/derwaschsalon/thewashbot:latest
            ghcr.io/derwaschsalon/thewashbot:${{ github.sha }}
