name: Pakete

# nexproto: Formate und alle daraus erzeugten Dateien (Schemas, C, JS, TS, Rust) aktuell
# nexcore: Tests, Lint, strikte Typen und Abhängigkeitsrichtung
# infra: Skripte mit eigener Logik (Changelog)
# daemon: Tests des NexBoard-Daemons und des Radars, samt denen, die das Submodul capture/a2tools brauchen
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nexproto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
        working-directory: proto

  nexcore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nexcore
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run mypy

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx pytest -q infra/tests

  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexboard/daemon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m pytest -q
      # das Radar läuft im Daemon und nutzt dessen Umgebung; der Goldtest überspringt sich ohne Mitschnitte
      - run: uv run --project ../daemon python -m pytest -q tests
        working-directory: nexboard/radar
