name: nexproto

# Prüft die Formate und dass alle daraus erzeugten Dateien (Schemas, C, JS, TS, Rust) aktuell sind
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
        working-directory: proto
