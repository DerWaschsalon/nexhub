name: Bot

# TheWashBot: Tests, Lint und strikte Typen (für die Dateien in bot/pyproject.toml, [tool.mypy] files)
on:
  push:
    branches: [main]
    paths: ["bot/**", "proto/**", "packages/nexcore/**", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["bot/**", "proto/**", "packages/nexcore/**", ".github/workflows/bot.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ../proto ../packages/nexcore pytest ruff mypy
      - run: python -m pytest -q tests
      - run: ruff check .
      - run: mypy
