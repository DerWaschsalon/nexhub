[project]
name = "nexhub-api"
version = "0.1.0"
description = "NexHub: API mit Discord-Login"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "nexproto",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
# Gemeinsame Formate (NexLog) aus dem Monorepo, siehe proto/README.md
nexproto = { path = "../../proto", editable = true }

[dependency-groups]
dev = ["aiosqlite>=0.20", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexhub_api"]
