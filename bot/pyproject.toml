# Nur Werkzeug-Einstellungen; der Bot läuft per requirements.txt im Docker-Image.
# Gleiche Regeln wie packages/nexcore (CLAUDE.md, „Neubau NexBoard: verbindliche Regeln“).
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# Übergang: Dateien, die der Umbau noch neu schreibt, dürfen lange Zeilen haben. Jeder Schritt
# streicht seine Dateien hier.
[tool.ruff.lint.per-file-ignores]
"bot/cogs/aion_dedup.py" = ["E501"]
"bot/modules/notify/feeds/wizard.py" = ["E501"]
"bot/cogs/server.py" = ["E501"]
"bot/cogs/settings.py" = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
# Strikt geprüft wird, was schon nach den Neubau-Regeln steht. Jeder Umbauschritt hängt seine
# Dateien hier an, bis am Ende das ganze Paket drinsteht (Konzept „TheWashBot – Umbau auf kleine Module“).
files = [
    "bot/aion_format.py",
    "bot/aion_records.py",
    "bot/cogs/aion_ranking.py",
    "bot/core",
    "bot/forms.py",
    "bot/panel.py",
    "bot/modules",
    "tests/core",
    "tests/modules",
]
follow_imports = "silent"
# nexcore und nexproto aus dem Monorepo (im Image als Pakete installiert)
mypy_path = ["../packages/nexcore", "../proto"]
# bot/ und bot/cogs/ haben keine __init__.py (Namespace-Pakete)
explicit_package_bases = true

# Übergang: Klick-Assistent und Provider der Benachrichtigungen sind nur umgezogen, ihre Typangaben
# folgen in Schritt 7. Bis dahin prüft mypy sie nicht strikt.
[[tool.mypy.overrides]]
module = ["bot.modules.notify.feeds.wizard", "bot.modules.notify.feeds.providers.*"]
ignore_errors = true
