# Nur Werkzeug-Einstellungen; der Bot läuft per requirements.txt im Docker-Image.
# Gleiche Regeln wie packages/nexcore (CLAUDE.md, „Neubau NexBoard: verbindliche Regeln“).
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true
# Strikt geprüft wird, was schon nach den Neubau-Regeln steht. Jeder Umbauschritt hängt seine
# Dateien hier an, bis am Ende das ganze Paket drinsteht (Konzept „TheWashBot – Umbau auf kleine Module“).
files = [
    "bot/cogs/settings.py",
    "bot/core",
    "bot/forms.py",
    "bot/panel.py",
    "bot/modules",
    "tests/core",
    "tests/modules",
]
follow_imports = "silent"
# nexcore und nexproto aus dem Monorepo (im Image als Pakete installiert)
mypy_path = ["../packages/nexcore", "../proto"]
# bot/ und bot/cogs/ haben keine __init__.py (Namespace-Pakete)
explicit_package_bases = true

