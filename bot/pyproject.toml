# Nur Werkzeug-Einstellungen; der Bot läuft per requirements.txt im Docker-Image.
# Gleiche Regeln wie packages/nexcore (CLAUDE.md, „Neubau NexBoard: verbindliche Regeln“).
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true
# Das ganze Paket wird strikt geprüft. Die alten Sammel-Tests (tests/test_*.py) folgen, sobald sie
# auf die Module aufgeteilt sind (Konzept „TheWashBot – Umbau auf kleine Module“).
files = ["bot", "tests"]
follow_imports = "silent"
# nexcore und nexproto aus dem Monorepo (im Image als Pakete installiert)
mypy_path = ["../packages/nexcore", "../proto"]
# bot/ und bot/cogs/ haben keine __init__.py (Namespace-Pakete)
explicit_package_bases = true
